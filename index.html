<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d439b"><title>Bead Designer</title><style>:root{font-family:system-ui,sans-serif;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f4f6fa;color:#1b2838}header{background:#6d439b;color:white;padding:24px 5vw}header h1{margin:0}main{max-width:1100px;margin:25px auto;padding:0 18px}.card{background:white;border:1px solid #d9e1ed;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 12px #1b28380b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #aab9cb;border-radius:9px;max-width:100%}input,textarea,select{width:100%}label{display:block;margin:10px 0}button{cursor:pointer;background:#6d439b;color:white;border:0;margin:4px 5px 4px 0}button.secondary{background:#526477}small,.muted{color:#596a7c}table{width:100%;border-collapse:collapse}td,th{padding:8px;text-align:left;border-bottom:1px solid #e0e5ed}.scroll{overflow-x:auto}@media print{header,.no-print,button{display:none!important}body{background:white}.card{box-shadow:none;border:0}}</style></head><body><header><h1>Bead Designer</h1><div>Free • Offline-first • Your records stay in this browser</div></header><main><div class="grid"><section class="card"><h2>Design controls</h2><label>Design name<input id="name" value="My bead pattern"></label><label>Rows<input id="rows" type="number" min="1" max="30" value="8" onchange="resize()"></label><label>Columns<input id="cols" type="number" min="1" max="30" value="12" onchange="resize()"></label><label>Bead color<input id="color" type="color" value="#ef4444"></label><label>Price per bead ($)<input id="price" type="number" min="0" step=".01" value=".04" oninput="render()"></label><button onclick="clearPattern()">Clear</button><button onclick="savePattern()">Save design</button><button onclick="window.print()">Print pattern</button><h3>Saved designs</h3><div id="saved"></div></section><section class="card"><h2>Pattern grid</h2><div class="scroll"><div id="pattern"></div></div><p id="stats"></p><small>Tap a circle to color it. Right-click to erase on desktop.</small></section></div><div class="card no-print"><button onclick="exportData()">Export JSON backup</button><label>Import backup<input type="file" accept=".json,application/json" onchange="importData(this)"></label><small>Backups are not cloud synced. Do not put private backups in public GitHub repositories.</small></div></main><script>const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);function load(key,fallback){try{return JSON.parse(localStorage.getItem(key))||fallback}catch{return fallback}}function save(){try{localStorage.setItem(KEY,JSON.stringify(data));render()}catch(e){alert('Could not save locally: '+e.message)}}function exportData(){const blob=new Blob([JSON.stringify({app:KEY,version:1,records:data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=KEY+'-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}async function importData(input){const file=input.files[0];if(!file)return;try{const x=JSON.parse(await file.text());if(x.app!==KEY||x.version!==1||!Array.isArray(x.records))throw Error('Wrong backup format');if(!confirm('Replace saved records with '+x.records.length+' imported items?'))return;data=x.records;save()}catch(e){alert(e.message)}finally{input.value=''}}const KEY='beaddesigns-v1';let data=load(KEY,[]),rows=8,cols=12,cells=Array(rows*cols).fill('#ffffff');function resize(){const r=Math.min(30,Math.max(1,Number($('rows').value)||8)),c=Math.min(30,Math.max(1,Number($('cols').value)||12)),next=Array(r*c).fill('#ffffff');for(let y=0;y<Math.min(r,rows);y++)for(let x=0;x<Math.min(c,cols);x++)next[y*c+x]=cells[y*cols+x];rows=r;cols=c;cells=next;render()}function paint(i,erase=false){cells[i]=erase?'#ffffff':$('color').value;render()}function clearPattern(){if(confirm('Clear current design?')){cells.fill('#ffffff');render()}}function savePattern(){data.push({id:id(),name:$('name').value||'Untitled',rows,cols,cells:[...cells]});save()}function openPattern(k){const x=data.find(x=>x.id===k);if(!x)return;rows=x.rows;cols=x.cols;cells=[...x.cells];$('rows').value=rows;$('cols').value=cols;$('name').value=x.name;render()}function removePattern(k){if(confirm('Delete saved design?')){data=data.filter(x=>x.id!==k);save()}}function render(){const root=$('pattern');root.innerHTML='';root.style.display='grid';root.style.gridTemplateColumns='repeat('+cols+',24px)';root.style.gap='3px';cells.forEach((color,i)=>{const b=document.createElement('button');b.title='Row '+(Math.floor(i/cols)+1)+', column '+(i%cols+1);b.style.cssText='width:24px;height:24px;border-radius:50%;padding:0;margin:0;border:1px solid #8793a6;background:'+color;b.onclick=()=>paint(i);b.oncontextmenu=e=>{e.preventDefault();paint(i,true)};root.append(b)});const used=cells.filter(x=>x!=='#ffffff').length;$('stats').textContent=used+' colored beads · '+cells.length+' grid spaces · Estimated colored bead cost: $'+(used*(Number($('price').value)||0)).toFixed(2);$('saved').innerHTML=data.map(x=>'<div><button onclick="openPattern(\''+x.id+'\')">'+esc(x.name)+'</button><button class="secondary" onclick="removePattern(\''+x.id+'\')">Delete</button></div>').join('')||'<p>No saved patterns.</p>'}render();</script></body></html>
